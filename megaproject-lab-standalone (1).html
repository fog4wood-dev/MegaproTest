<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เมกะโปรเจกต์ โต๊ะทดลอง (ไฟล์เดี่ยว ออฟไลน์/ออนไลน์/GAS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;700;800&family=Mali:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --frame:#E2321B; --frame-ink:#6E1207; --panel:#F3F2EF; --paper:#FFFFFF; --ink:#1D1A18; --ink2:#5F5852;
  --line:#D9D4CD; --tab:#FFC25C; --tab-ink:#4A2A00; --ok:#A6E9BE; --ok-ink:#0F5C33; --bad:#FFB0AC; --bad-ink:#86150F;
  --staff:#22C3EC; --staff-ring:#1E3D86; --item:#F48A52; --item-ring:#C9311E; --budget:#F7CF88; --budget-ring:#C88722;
  --ocb:#1E9E50; --cwb:#D63B2F; --edge:#B9B5B0; --me:#FFF2D6;
  --head:"Kanit","Noto Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  --body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --frame:#9E2414; --frame-ink:#2A0702; --panel:#1C1917; --paper:#272320; --ink:#F2EDE8; --ink2:#B8AEA6;
  --line:#3E3833; --tab:#E7A93D; --tab-ink:#2A1700; --ok:#1F5A38; --ok-ink:#BDF2CF; --bad:#6A2420; --bad-ink:#FFD2CE;
  --edge:#55504A; --me:#3A2E1B;
}}
:root[data-theme="dark"]{
  --frame:#9E2414; --frame-ink:#2A0702; --panel:#1C1917; --paper:#272320; --ink:#F2EDE8; --ink2:#B8AEA6;
  --line:#3E3833; --tab:#E7A93D; --tab-ink:#2A1700; --ok:#1F5A38; --ok-ink:#BDF2CF; --bad:#6A2420; --bad-ink:#FFD2CE;
  --edge:#55504A; --me:#3A2E1B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--frame);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.shell{max-width:1180px;margin:0 auto;padding:10px}
.sheet{background:var(--panel);border-radius:14px;padding:14px 14px 22px;min-height:calc(100vh - 20px)}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
.tab{display:inline-block;background:var(--tab);color:var(--tab-ink);font-family:var(--head);font-weight:700;font-size:18px;padding:4px 14px 5px;border-radius:0 8px 8px 0;margin:0 0 10px -14px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:9px;padding:7px 13px;font-weight:600;cursor:pointer;min-height:40px}
.btn.primary{background:var(--frame);border-color:var(--frame-ink);color:#fff}
.btn.go{background:var(--ocb);border-color:#0d5a2c;color:#fff}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--tab);outline-offset:2px}
.mini{min-height:30px;padding:3px 9px;font-size:13px;border-width:1.5px;border-radius:7px}
.box{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.grid2{display:grid;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:1.05fr .95fr;align-items:start}}
.grid2>*{min-width:0}

/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.logo{font-family:var(--head);font-weight:800;font-size:clamp(34px,8vw,58px);line-height:.9;color:var(--frame);letter-spacing:-.5px;
  -webkit-text-stroke:2px var(--frame-ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--tab);transform:rotate(-2deg);transform-origin:left bottom}
.hero p{margin:6px 0 0;max-width:46ch}

/* tokens */
.tok{display:inline-block;width:24px;height:24px;vertical-align:middle;flex:none;border:0}
.tok.lg{width:34px;height:34px}
.res-line{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.res-line span{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:600;border:1.5px solid}
.badge.ocb{color:var(--ocb);border-color:var(--ocb)}
.badge.cwb{color:var(--cwb);border-color:var(--cwb)}
.badge.kpi{color:var(--ink);border-color:var(--ink)}

/* cards */
.rowhead{display:flex;align-items:center;gap:8px;margin:10px 0 6px}
.rowhead b{font-family:var(--head);font-size:16px}
.deckpile{font-size:12px;color:var(--ink2)}
.cards{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.card{position:relative;flex:none;width:150px;background:var(--paper);border:3px solid var(--edge);border-radius:13px;padding:30px 8px 8px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.card.rush{border:3px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(160deg,#E2321B,#F4A11C 60%,#FFE45C) border-box}
.flag{position:absolute;top:-3px;left:9px;width:30px;height:34px;background:var(--frame);color:#fff;font-family:var(--head);font-weight:800;font-size:19px;display:grid;place-items:center;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.card.rush .tag-rush{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--frame)}
.cname{font-weight:600;font-size:13px;line-height:1.3;min-height:34px}
.rbox{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.rbox div{border:1.5px solid var(--line);border-radius:7px;display:flex;flex-direction:column;align-items:center;padding:3px 0 2px;gap:1px}
.rbox svg{width:15px;height:15px;color:var(--ink)}
.rbox b{font-family:var(--head);font-size:15px;line-height:1}
.rbox .full{background:var(--ok);border-color:transparent}
.strip{font-size:11px;line-height:1.3;border-radius:6px;padding:3px 6px;font-weight:600}
.strip.ok{background:var(--ok);color:var(--ok-ink)}
.strip.bad{background:var(--bad);color:var(--bad-ink)}
.deadline{font-size:12px;font-weight:700;color:var(--cwb)}
.card .acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
/* การ์ดโฉมใหม่ (แบบของผู้ใช้ 12 ต.ค.) ทุกขนาดคูณ --u จากต้นฉบับ 744×1039 px */
.cw{--u:.2554;flex:none;width:calc(744px*var(--u));display:flex;flex-direction:column;gap:5px;scroll-snap-align:start}
.mc{position:relative;width:calc(744px*var(--u));height:calc(1039px*var(--u));border-radius:calc(30px*var(--u));overflow:hidden;border:1px solid #111;font-family:"Mali",var(--body);color:#111}
.mc.gr{background:linear-gradient(180deg,#A6A6A6 0%,#C4C4C4 55%,#DADADA 100%)}
.mc.rd{background:linear-gradient(180deg,#FF3E33 0%,#FF8C3F 50%,#FFE44B 100%)}
.mc .panel{position:absolute;left:calc(34px*var(--u));right:calc(40px*var(--u));top:calc(45px*var(--u));bottom:calc(46px*var(--u));background:#fff;border-radius:calc(22px*var(--u));display:flex;flex-direction:column;justify-content:flex-end;padding:0 calc(16px*var(--u))}
.mc .rib{position:absolute;left:calc(84px*var(--u));top:0;width:calc(160px*var(--u));height:calc(206px*var(--u));background:#FF3131;z-index:2;clip-path:polygon(0 0,100% 0,100% 85%,50% 100%,0 85%);display:flex;justify-content:center;font-weight:600;font-size:calc(124px*var(--u));color:#fff;line-height:1;padding-top:calc(44px*var(--u))}
.mc .fx{position:absolute;left:calc(256px*var(--u));right:calc(58px*var(--u));top:calc(59px*var(--u));display:flex;gap:calc(13px*var(--u));z-index:2}
.mc.gr .fx{left:calc(273px*var(--u))}
.fc{height:calc(72px*var(--u));border-radius:calc(16px*var(--u));display:flex;align-items:center;justify-content:center;padding:0 calc(10px*var(--u))}
.fc.ok{background:#98E8C1;flex:1.75;color:#00B85C}.fc.bad{background:#FF9E9E;flex:1;color:#E0201B}.fc.sk{background:#A9D8F7;color:#1A73C8}.fc.wide{flex:1}
.fg{display:inline-flex;align-items:center;gap:calc(4px*var(--u))}
.mc .ic{display:block;flex:none}
.fsep{display:block;width:calc(5px*var(--u));height:calc(56px*var(--u));background:#fff;margin:0 calc(16px*var(--u));border-radius:2px}
.fsl,.fnn{font-family:"Mali",var(--body);font-weight:700;font-size:calc(40px*var(--u));line-height:1}
.fsl{color:currentColor;margin:0 1px}.fnn{color:#111;margin-left:2px}
.mc .nm{font-weight:700;font-size:calc(46px*var(--u));line-height:1.2;text-align:center;margin-bottom:calc(8px*var(--u));text-wrap:balance}
.mc .nm.tmp{color:#9a9a9a}
.mc .res{display:flex;justify-content:space-between}
.mc .bx{width:calc(190px*var(--u));height:calc(235px*var(--u));border:1.5px solid #DADADA;border-radius:calc(18px*var(--u));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(10px*var(--u))}
.mc .bx img{width:calc(100px*var(--u));height:calc(100px*var(--u))}
.mc .bx .n{font-weight:700;font-size:calc(82px*var(--u));line-height:1}
.mc .bx .n.pr{font-size:calc(66px*var(--u))}
.mc .bx.z img{opacity:.22;filter:grayscale(1)}.mc .bx.z .n{color:#c4c4c4}
.mc .bx.full{background:#A6E9BE;border-color:#5BC489}
.mc .dl{position:absolute;right:calc(42px*var(--u));top:calc(380px*var(--u));display:flex;flex-direction:column;gap:calc(16px*var(--u));z-index:3}
.ic.off{opacity:.18;filter:grayscale(1)}
.fxcap{font-size:11.5px;line-height:1.35;color:var(--ink2)}
.cw .acts{display:flex;flex-wrap:wrap;gap:4px}
.legend{--u:.42;display:grid;gap:8px;margin:8px 0}
.legend>div{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.legend .fc{flex:none!important;min-width:calc(150px*var(--u))}
.slot{flex:none;width:190px;min-height:265px;border:2.5px dashed var(--line);border-radius:13px;display:grid;place-items:center;text-align:center;padding:10px;color:var(--ink2);font-size:13px}

/* players */
.pl{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--paper)}
.pl.turn{border-color:var(--frame);box-shadow:0 0 0 2px var(--frame) inset}
.pl.mine{background:var(--me)}
.pl h3{font-size:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prog{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:4px}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--ocb)}
.joblist{font-size:13px;margin:6px 0 0;padding:0;list-style:none}
.joblist li{border-top:1px dashed var(--line);padding:4px 0}
.jobhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.jobtok{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 10px}
.jt{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.jt .tok{width:20px;height:20px}
.jt.full b{color:var(--ocb)}.jt.empty{opacity:.55}
.jt .bw{font-style:normal;font-size:11px;font-weight:600;color:var(--cwb)}
.chip .jt{font-size:12px}
.cap{font-size:11px;color:var(--ink2)}

/* bars */
.turnbar{position:sticky;bottom:0;z-index:5;margin-top:14px;background:var(--ink);color:var(--panel);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.turnbar .btn{background:var(--panel);color:var(--ink);border-color:var(--panel)}
.turnbar .btn.primary{background:var(--frame);color:#fff;border-color:var(--frame)}
.turnbar .btn.go{background:var(--ocb);border-color:var(--ocb);color:#fff}
.turnbar .msg{flex:1 1 180px;font-weight:600}
.banner{border-radius:12px;padding:12px;margin:0 0 12px;border:2.5px solid var(--frame);background:var(--paper)}
.banner h3{font-size:18px;margin-bottom:4px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ocb)}
.log{max-height:260px;overflow:auto;font-size:13px;margin:0;padding:0;list-style:none}
.log li{padding:4px 0;border-top:1px dashed var(--line)}
.log li b{font-weight:600}
.log .r{color:var(--ink2);font-size:11px;margin-right:6px}
.seat{display:flex;align-items:center;gap:8px;justify-content:space-between;border-top:1px dashed var(--line);padding:8px 0;flex-wrap:wrap}
select{font:inherit;border:1.5px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--paper);color:var(--ink);min-height:32px}
.code{font-family:var(--head);font-weight:800;letter-spacing:3px;font-size:22px;background:var(--tab);color:var(--tab-ink);border-radius:8px;padding:0 10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--ink2)}
.tablewrap{overflow-x:auto}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,10,5,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.overlay{align-items:center}}
.modal{background:var(--panel);border-radius:14px;padding:16px;width:min(520px,100%);max-height:85vh;overflow:auto;border:3px solid var(--ink)}
.modal h2{font-size:20px;margin-bottom:8px}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:2px solid var(--line);border-radius:10px;padding:7px 11px;background:var(--paper);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;min-height:42px}
.chip.sel{border-color:var(--frame);box-shadow:0 0 0 2px var(--frame) inset}
.chip:disabled{opacity:.4;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:10px;z-index:30;font-weight:600;max-width:90vw;text-align:center}
.empty{padding:14px;text-align:center;color:var(--ink2)}

.modal.wide{width:min(780px,100%);max-height:90vh;padding:14px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
details.sec{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);margin:8px 0;padding:0 12px}
details.sec>summary{cursor:pointer;font-family:var(--head);font-weight:700;font-size:16px;padding:8px 0;min-height:44px;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-weight:700;color:var(--frame);font-size:20px}
details.sec[open]>summary::after{content:"−"}
details.sec>summary:focus-visible{outline:3px solid var(--tab);outline-offset:2px;border-radius:6px}
details.sec .body{padding:0 0 12px;font-size:14.5px}
details.sec .body ul,details.sec .body ol{margin:6px 0;padding-left:22px}
details.sec .body li{margin:3px 0}
details.sec .body p{margin:6px 0}
td.wrap{white-space:normal;min-width:170px}
tr.rushrow td{background:rgba(226,50,27,.12)}
.eqtab td,.eqtab th{padding:5px 8px}
@media (prefers-reduced-motion:no-preference){ .pl.turn{transition:box-shadow .2s} }
</style>
</head>
<body>
<div class="shell"><div class="sheet" id="app"><p class="muted">กำลังโหลด…</p></div></div>
<script>
/* แสดงข้อผิดพลาดบนหน้าแทนหน้าว่าง (ช่วยหาสาเหตุเวลาเปิดผ่าน Apps Script) */
(function () {
  function show(msg) {
    var box = document.getElementById("bootErr");
    if (!box) { box = document.createElement("div"); box.id = "bootErr"; box.style.cssText = "margin:12px;padding:12px;border:2px solid #D7261E;border-radius:10px;background:#FFFCF5;color:#1D3F7A;font:14px/1.5 sans-serif;white-space:pre-wrap;word-break:break-word"; document.body.insertBefore(box, document.body.firstChild); box.textContent = "หน้าเกมโหลดไม่สำเร็จ ส่งข้อความนี้ให้ผู้ดูแล:\n"; }
    box.textContent += "\n• " + msg;
  }
  window.addEventListener("error", function (e) { show((e.message || "error") + (e.lineno ? " (บรรทัด " + e.lineno + ":" + e.colno + ")" : "")); });
  window.addEventListener("unhandledrejection", function (e) { var r = e.reason; show("Promise: " + ((r && r.message) || r)); });
  setTimeout(function () { var a = document.getElementById("app"); if (a && /กำลังโหลด|กำลังเชื่อมต่อ/.test(a.textContent) && a.textContent.length < 40) show("ผ่านไป 15 วินาทียังโหลดไม่เสร็จ (ค้างที่: " + a.textContent.trim() + ") " + (window.google && window.google.script ? "มี google.script" : "ไม่พบ google.script") + " · ส่วน1=" + (window.__APP1__ || 0) + " ส่วน2=" + (window.__APP2__ || 0) + " · script " + document.scripts.length + " · ยาว " + document.documentElement.innerHTML.length); }, 15000);
})();
</script>

<div id="rulesRoot"></div>
<div id="dialogRoot"></div>

    if (!snap.exists) { toast("ห้องนี้ถูกลบไปแล้ว"); return false; }

}

function scheduleBots() {

  const task = botTask(game); if (!task) return;
  const seated = game.seats.some(s => s.kind === "human" && s.uid === myId);
  const isCreator = isHostOf(game);
  if (!seated && !isCreator) return;
  const base = botMode === "human" ? thinkDelay(task) : botSpeed;
  const delay = isCreator ? base : Math.max(base, 2000 * thinkScale());
  const seqAt = game.seq;
  botTimer = setTimeout(() => {
    if (!game || game.seq !== seqAt) return;
    transact(st => { const t = botTask(st); if (!t) return SILENT; st.cfg = Object.assign({}, st.cfg, { botMode, botMs: botMode === "human" ? "human" : botSpeed }); runBot(st, t); return null; }, false);

}

    dialogCancel = () => done(null);
    const inp = document.getElementById("dlgIn"); inp.focus(); inp.select();

const gasRun = () => (window.google && window.google.script && window.google.script.run) || null;
const statsUrl = () => ((window.__STATS_ENDPOINT__ || lsGet("mp_statsurl") || "") + "").trim();
const uploadHost = g => (typeof HOT === "function" && HOT()) || (g && g.createdBy === myId);
const syncOn = () => !window.__GAS__ && !!(gasRun() || statsUrl());
function queuePending(rec) { try { const q = JSON.parse(lsGet("mp_pendingstats") || "[]"); if (!q.some(x => x.code === rec.code && x.endedAt === rec.endedAt)) q.push(rec); lsSet("mp_pendingstats", JSON.stringify(q.slice(-300))); } catch (e) {} }
function dropPending(rec) { try { const q = JSON.parse(lsGet("mp_pendingstats") || "[]").filter(x => !(x.code === rec.code && x.endedAt === rec.endedAt)); lsSet("mp_pendingstats", JSON.stringify(q)); } catch (e) {} }
async function uploadStats(rec) {
  const body = JSON.stringify(Object.assign({ app: "mplab" }, rec)); const run = gasRun();
  if (run) return new Promise(res => run.withSuccessHandler(r => { dropPending(rec); res(true); }).withFailureHandler(() => { queuePending(rec); res(false); }).saveStats(body));
  const url = statsUrl(); if (!url) return false;
  try { await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body }); dropPending(rec); return true; }
  catch (e) { queuePending(rec); return false; }
}
async function flushPending() { if (!syncOn()) return 0; let q = []; try { q = JSON.parse(lsGet("mp_pendingstats") || "[]"); } catch (e) {} let ok = 0; for (const r of q) { if (await uploadStats(r)) ok++; } return ok; }

function renderStats() {

function renderStatsInner(old) {

function renderPending(me) {

  if (p.type === "trade") {

      if (p.eff === "strip") { const j = pl.jobs[o.j]; return `${who} · ${esc(CARDS[j.cid].name)} · ดึง${tok(o.t)}${TN[o.t]} (บนใบ ${removable(j, o.t)}) ${jobTok(j)}`; }
      if (p.eff === "steal") { if (o.j >= 0) { const j = pl.jobs[o.j]; return `${who} · ใบงาน ${esc(CARDS[j.cid].name)} · ขอ${tok(o.t)}${TN[o.t]} (บนใบ ${removable(j, o.t)}) ${jobTok(j)}`; } return `${who} · สต็อก · ขอ${tok(o.t)}${TN[o.t]} (มี ${pl.stock[o.t]})`; }

      return who;
    };
    const isSwap = p.eff === "swap"; let swapRow = null;
    if (isSwap && effPicks.length) { const o0 = opts[effPicks[0]]; if (o0) swapRow = rowOf(CARDS[game.players[o0.p].jobs[o0.j].cid].kpi); }
    const rowKey = isAdd ? p.row : swapRow; const rowCards = rowKey ? game.market[rowKey] : [];
    const cardsRow = rowKey ? rowCards.map((x, ix) => { const c = CARDS[x.id]; return `<button class="chip${effCard === ix ? " sel" : ""}" data-a="effcard" data-i="${ix}">${c.rush ? "(ด่วน) " : ""}${esc(c.name)} (KPI ${c.kpi}, ใช้ ${sum(c.need)} ชิ้น)</button>`; }).join("") : "";
    const needCard = isAdd || (isSwap && rowCards.length > 0);

        <div class="row">${T.map(x => `<div class="stepper">${tok(x)}<button data-a="rspl" data-t="${x}" data-d="-1" aria-label="ลด${TN[x]}">−</button><b>${rsPick[x]}</b><button data-a="rspl" data-t="${x}" data-d="1" aria-label="เพิ่ม${TN[x]}" ${rsPick[x] >= game.central[x] || tot >= p.need ? "disabled" : ""}>+</button><span class="cap">กองกลาง ${game.central[x]}</span></div>`).join("")}</div>
        <div class="row" style="margin-top:8px"><button class="btn primary" data-a="rsgo" ${tot === p.need ? "" : "disabled"}>เสนอคืน ${tot}/${p.need} ชิ้น</button></div></div>`;
    }
    const vs = game.seats.map((s, i) => `${nm(i)} ${i in p.votes ? (p.votes[i] ? "✓ เห็นด้วย" : "✗ ไม่เห็นด้วย") : i === p.cur ? "กำลังตัดสินใจ" : "รอ"}`).join(" · ");
    return `<div class="banner"><h3>${head}</h3><p style="margin:4px 0">${nm(p.proposer)} เสนอคืน <b>${T.filter(x => p.take[x]).map(x => `${tok(x)} ${p.take[x]}`).join(" ")}</b> ถ้าผ่าน ทุกคนรับ OCB 1</p><p class="small" style="margin:4px 0">${vs}</p>
      ${me === p.cur ? `<div class="row"><button class="btn go" data-a="rsyes">เห็นด้วย</button><button class="btn" data-a="rsno">ไม่เห็นด้วย</button></div>` : ""}</div>`;
  }

      <p class="small" style="margin:10px 0 4px">หรือหยิบชนิดอื่นจากกองกลางแทน 2 ชิ้น (เลือกชนิดเอง ต้องไม่เกินเพดาน)</p>
      <div class="row">${T.filter(x => x !== p.t).map(x => { const mx = Math.min(game.central[x], room(pl, x)); return `<div class="stepper">${tok(x)}<button data-a="fbpl" data-t="${x}" data-d="-1" aria-label="ลด${TN[x]}">−</button><b>${fbPick[x]}</b><button data-a="fbpl" data-t="${x}" data-d="1" aria-label="เพิ่ม${TN[x]}" ${fbPick[x] >= mx || tot >= 2 ? "disabled" : ""}>+</button><span class="cap">กองกลาง ${game.central[x]} · ถือได้อีก ${room(pl, x)}</span></div>`; }).join("")}</div>
      <div class="row" style="margin-top:8px"><button class="btn primary" data-a="fbgo" ${tot ? "" : "disabled"}>หยิบ ${tot} ชิ้นจากกองกลาง</button></div></div>`;

function skillLine(pl, mine) {
  const sk = (pl.skills || []).map(id => CARDS[id]).filter(c => c && c.skill); if (!sk.length) return "";
  return `<div class="small" style="margin-top:6px"><b>สกิลติดตัว</b>${mine ? " (หยิบรวมไม่เกิน 2 ชิ้นต่อการส่งงาน)" : ""}: ${sk.map(c => `<span class="badge kpi" title="${esc(c.name)}">${c.skill.mode === "spec" ? tok(c.skill.type) + " เจาะจง" + TN[c.skill.type] : "สุ่มจากถุง"} 1</span>`).join(" ")}</div>`;
}
function renderMyBoard(me) {
  const pl = game.players[me]; const myTurn = isTurn(game, me); const open = slotsOpen(pl);
  const jobs = pl.jobs.map((j, idx) => {
    let acts = "";
    if (myTurn) {
      const m = missingOf(j);
      acts += T.filter(t => m[t] > 0 && pl.stock[t] > 0).map(t => `<button class="btn mini" data-a="place" data-j="${idx}" data-t="${t}" title="วาง${TN[t]}จากสต็อก ไม่เสียแอ็กชัน">วาง ${tok(t)}</button>`).join("");
      if (!pl.used) {
        const t1 = T.find(t => m[t] > 0);
        if (sum(m) === 1 && game.central[t1] > 0) acts += `<button class="btn mini" data-a="borrow" data-j="${idx}">ยืมฉุกเฉิน</button>`;
        acts += `<button class="btn mini ghost" data-a="discard" data-j="${idx}">ทิ้งงาน</button>`;
      }
    }
    return cardHTML(j.cid, { job: j, acts });
  });
  for (let k = pl.jobs.length; k < open; k++) jobs.push(`<div class="slot">ช่องว่าง<br>รับงานจากตลาดด้านซ้าย</div>`);
  return `<div class="box"><span class="tab">กระดานของคุณ</span>
    <div class="row"><span class="badge kpi">KPI ${pl.kpi}</span><span class="badge ocb">OCB ${pl.ocb}</span><span class="badge cwb">CWB ${pl.cwb}</span><b>สุทธิ ${net(pl)}</b></div>
    <div style="margin:8px 0">${holdLine(pl, true)}<div class="cap">ที่ถือรวม (สต็อก + บนใบงาน) / เพดาน ต่อชนิด</div></div>
    <div class="prog">งาน KPI 3 ${meter(pl.done.k3, 3)} ${pl.done.k3}/3 <span>งาน KPI 4–5 ${meter(pl.done.k4 + pl.done.k5, 4)} ${pl.done.k4 + pl.done.k5}/4</span></div>${skillLine(pl, true)}
    <div class="cards" data-scroll="mine" style="margin-top:8px">${jobs.join("")}</div></div>`;
}

function renderPlay() {
  const me = seatOf(game); const myTurn = me >= 0 && isTurn(game, me); const pl = me >= 0 ? game.players[me] : null;
  const isC = isHostOf(game);
  const canTakeJob = myTurn && !pl.used && pl.jobs.length < slotsOpen(pl);
  const market = ROWS.map(row => `<div class="rowhead"><b>KPI ${ROWKPI[row]}</b><span class="deckpile">เหลือในกอง ${game.decks[row].length} ใบ${game.pile && game.pile[row] && game.pile[row].length ? ` · ส่งแล้วรอสับ ${game.pile[row].length} ใบ` : ""}</span></div>
    <div class="cards" data-scroll="${row}">${game.market[row].map((x, idx) => cardHTML(x.id, { acts: canTakeJob ? `<button class="btn mini primary" data-a="takejob" data-row="${row}" data-idx="${idx}">รับงาน</button>` : "" })).join("") || '<p class="small muted">กองหมดแล้ว</p>'}</div>`).join("");
  const cr = crisisRow(game);
  const crisisNote = cr ? `<p class="small" style="margin:6px 0 0;color:var(--frame);font-weight:600">แถว KPI ${ROWKPI[cr]} เต็มไปด้วยงานด่วน ผู้เล่นที่ถึงตาเปิดประชุมวิกฤตได้</p>` : "";
  let bar;
  if (myTurn) {

const EV_TH = { rushOk: "ด่วนสำเร็จ", rushFail: "ด่วนพลาด", trades: "ขอแลก", tradesOk: "แลกสำเร็จ", borrows: "ยืมฉุกเฉิน", discards: "ทิ้งงาน", crisis: "เปิดประชุม", crisisOk: "ประชุมสำเร็จ", haulGot: "หยิบฟรีได้", skillGot: "สกิลได้", ocbDecline: "ไม่ใช้ผลรับ OCB", restockOk: "เติมของผ่าน", restockFail: "เติมของไม่ผ่าน", reshuffle: "สับกองใหม่", ocbShort: "OCB ไม่พอแจก", ocbNoTarget: "ไม่มีเป้ารับ OCB", fbBag: "กองกลางไม่มี→ถุง", fbOther: "กองกลางไม่มี→ชนิดอื่น", idle: "เทิร์นว่าง", attacks: "ใช้ผลด่วนกับคนอื่น" };
const PCOL = ["#D7261E", "#1D3F7A", "#E09A00", "#1E9E50", "#8A3FB8", "#0E8FA8"];
function roundReport(g) {
  const H = g.hist || []; if (!H.length) return `<p class="small muted" style="margin:0">ยังไม่จบรอบแรก รายงานจะขึ้นหลังจบแต่ละรอบ</p>`;
  const n = g.nSeats; const netOf = x => x[0] + x[1] - x[2];
  const maxN = Math.max(1, ...H.flatMap(h => h.p.map(netOf))); const W = 600, Hh = 190, L = 30, B = 22, R = 10, Tp = 10;
  const X = i => L + (H.length === 1 ? 0 : i * (W - L - R) / (H.length - 1)), Y = v => Tp + (Hh - Tp - B) * (1 - v / maxN);
  const ticks = [0, Math.round(maxN / 2), maxN];
  const lines = Array.from({ length: n }, (_, k) => `<polyline fill="none" stroke="${PCOL[k % 6]}" stroke-width="2.5" points="${H.map((h, i) => `${X(i).toFixed(1)},${Y(netOf(h.p[k])).toFixed(1)}`).join(" ")}"/>`).join("");
  const step = Math.max(1, Math.ceil(H.length / 12));
  const chart = `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto;display:block" role="img" aria-label="คะแนนสุทธิแต่ละรอบ">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 5}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink2)">${v}</text>`).join("")}
    ${H.map((h, i) => (i % step === 0 || i === H.length - 1) ? `<text x="${X(i)}" y="${Hh - 6}" text-anchor="middle" font-size="11" fill="var(--ink2)">${h.r}</text>` : "").join("")}${lines}</svg>
    <div class="row small" style="margin:4px 0 8px">${Array.from({ length: n }, (_, k) => `<span style="display:inline-flex;align-items:center;gap:4px"><i style="width:14px;height:4px;border-radius:2px;background:${PCOL[k % 6]};display:inline-block"></i>${esc(pname(k, g))}</span>`).join("")}</div>`;
  const rows = H.slice().reverse().map(h => `<tr><td>${h.r}</td><td>${h.c.join("/")}</td><td>${h.b.join("/")}</td>${h.p.map(x => `<td><b>${netOf(x)}</b> <span class="cap">${x[3]}·${x[4]}${x[5] ? ` · ถือ ${x[5]} ใบ` : ""}</span></td>`).join("")}<td class="wrap small">${Object.entries(h.ev).map(([k, v]) => `${EV_TH[k] || k} ${v}`).join(", ") || "–"}</td></tr>`).join("");
  return `${chart}<div class="tablewrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>รอบ</th><th>กองกลาง คน/ของ/เงิน</th><th>ในถุง</th>${Array.from({ length: n }, (_, k) => `<th style="color:${PCOL[k % 6]}">${esc(pname(k, g))}</th>`).join("")}<th>เกิดอะไรในรอบนี้</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small muted" style="margin:6px 0 0">ตัวเลขหนาคือคะแนนสุทธิตอนจบรอบ ตัวเล็กคืองานที่ส่งแล้ว KPI 3 · KPI 4–5 และจำนวนใบที่ถืออยู่ ค่าทั้งหมดนับตอนจบรอบหลังเติมกองกลาง</p>`;
}

    ${LOCAL ? `<div class="row" style="margin-top:10px"><button class="btn mini" data-a="savegame">ดาวน์โหลดบันทึกเกมนี้ (JSON)</button></div>` : ""}`;

/* ---------- modals ---------- */
function renderModal() {

        <button class="chip${modal.d === -1 ? " sel" : ""}" data-a="md" data-d="-1" ${room(pl, t) && !rushOnly ? "" : "disabled"}>เข้าสต็อก</button></div>${rushOnly ? `<p class="small" style="margin:0;color:var(--frame);font-weight:600">งานด่วนยังขาด${TN[t]} ระบบวางลงงานด่วนให้ก่อน</p>` : ""}
        <p class="small muted">ที่ถือ${TN[t]}อยู่ ${held(pl, t)}/${pl.caps[t]} (นับรวมที่วางบนใบงาน) ${room(pl, t) ? "" : "เต็มเพดานแล้ว หยิบเพิ่มไม่ได้ ถ้างานขาดอีก 1 ชิ้นใช้ยืมฉุกเฉินได้"}</p>`;
